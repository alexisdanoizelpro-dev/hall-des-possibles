<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
  <meta name="theme-color" content="#080b08">
  <meta name="description" content="Franchissez le seuil du Hall des Possibles.">
  <title>Le Hall des Possibles — V0.5</title>
  <link rel="preload" href="hall-vivant.webp" as="image">
  <link rel="stylesheet" href="style.css?v=0.5">
  <script src="script.js?v=0.5" defer></script>
</head>
<body>
<main class="experience" id="experience">
  <section class="seuil" id="seuil" aria-label="Le seuil du Hall des Possibles">
    <div class="seuil__ambiance" aria-hidden="true"></div>
    <header class="seuil__texte">
      <h1 class="seuil__titre">Le Hall des Possibles</h1>
      <p class="seuil__phrase">Chaque histoire commence par une porte qui s'ouvre...<span>Que se cache-t-il derrière la vôtre&nbsp;?</span></p>
    </header>
    <div class="scene-porte">
      <div class="lueur-hall" aria-hidden="true"></div>
      <div class="encadrement" aria-hidden="true"><div class="encadrement__haut"></div><div class="encadrement__gauche"></div><div class="encadrement__droite"></div></div>
      <button class="porte" id="porte" type="button" aria-label="Ouvrir la porte du Hall des Possibles" aria-expanded="false">
        <span class="porte__panneau porte__panneau--haut" aria-hidden="true"></span><span class="porte__panneau porte__panneau--bas" aria-hidden="true"></span>
        <span class="porte__poignee" aria-hidden="true"><span class="porte__plaque"></span><span class="porte__bouton"></span></span><span class="porte__lumiere" aria-hidden="true"></span>
      </button>
    </div>
    <p class="seuil__invitation" id="invitation">Touchez la porte</p>
  </section>

  <section class="hall" id="hall" aria-label="Le Hall des Possibles" aria-hidden="true">
    <div class="hall__panorama" id="panorama" tabindex="0" aria-label="Explorez le Hall en faisant glisser la vue horizontalement">
      <div class="hall__scene" id="scene">
        <img class="hall__image" src="hall-vivant.webp" alt="Le Hall des Possibles, vaste atelier chaleureux autour d'une cheminée double foyer." draggable="false">
        <div class="fire-glow fire-glow--left" aria-hidden="true"></div><div class="fire-glow fire-glow--right" aria-hidden="true"></div><div class="dog-breath" aria-hidden="true"></div>
      </div>
    </div>
    <div class="hall__voile" aria-hidden="true"></div>
  </section>
</main>
</body>
</html>
