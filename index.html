<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#080b08">

  <meta
    name="description"
    content="Franchissez le seuil du Hall des Possibles."
  >

  <title>Le Hall des Possibles</title>

  <link rel="stylesheet" href="style.css?v=0.1.0">

  <script src="script.js?v=0.1.0" defer></script>
</head>

<body>

  <!--
    Chaque histoire commence par une porte qui s'ouvre.
    Bienvenue dans le Hall des Possibles.
  -->

  <main class="seuil" id="seuil">

    <div class="seuil__ambiance" aria-hidden="true"></div>

    <header class="seuil__texte">

      <h1 class="seuil__titre">
        Le Hall des Possibles
      </h1>

      <p class="seuil__phrase">
        Chaque histoire commence par une porte qui s'ouvre...

        <span>
          Que se cache-t-il derrière la vôtre&nbsp;?
        </span>
      </p>

    </header>

    <div class="scene-porte">

      <div class="lueur-hall" aria-hidden="true"></div>

      <div class="encadrement" aria-hidden="true">
        <div class="encadrement__haut"></div>
        <div class="encadrement__gauche"></div>
        <div class="encadrement__droite"></div>
      </div>

      <button
        class="porte"
        id="porte"
        type="button"
        aria-label="Ouvrir la porte du Hall des Possibles"
        aria-expanded="false"
      >

        <span
          class="porte__panneau porte__panneau--haut"
          aria-hidden="true"
        ></span>

        <span
          class="porte__panneau porte__panneau--bas"
          aria-hidden="true"
        ></span>

        <span class="porte__poignee" aria-hidden="true">
          <span class="porte__plaque"></span>
          <span class="porte__bouton"></span>
        </span>

        <span class="porte__lumiere" aria-hidden="true"></span>

      </button>

    </div>

    <p class="seuil__invitation" id="invitation">
      Touchez la porte
    </p>

    <p
      class="seuil__message"
      id="message"
      aria-live="polite"
    >
      Le Hall vous attend.
    </p>

  </main>

</body>

</html>
