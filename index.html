<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Le Hall des Possibles</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Le Seuil -->
    <section id="seuil">

    <img
        id="porte-image"
        src="porte-seuil-allée.png"
        alt="La Porte du Hall des Possibles">

</section>
    
    <!-- Le Hall -->
    <main id="hall">

        <!-- Le Hall ne changera jamais -->
        <img
            id="hall-image"
            src="hall-versionfondatrice.png"
            alt="Le Hall des Possibles">

        <!-- Tout ce qui vit dans le Hall -->
        <div id="hall-overlay"></div>

    </main>

    <script src="script.js"></script>

</body>

</html>
